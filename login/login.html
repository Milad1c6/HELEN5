
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Secret Place</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="background"></div>

    <div class="login-container">

        <div class="heart">
            ♥
        </div>

        <div class="small-title">
            A LITTLE PLACE
        </div>

        <h1>
            Just For Us
        </h1>

        <p class="description">
            Enter your little secret and discover what's waiting for you.
        </p>

        <form id="loginForm">

            <div class="input-box">

                <span>♡</span>

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    autocomplete="off"
                    required
                >

            </div>


            <div class="input-box">

                <span>⌑</span>

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

            </div>


            <button type="submit">

                <span>
                    ENTER
                </span>

                <strong>
                    →
                </strong>

            </button>

        </form>


        <div class="bottom-text">
            Made with love ♡
        </div>

    </div>


    <script src="login.js"></script>

</body>
</html>
